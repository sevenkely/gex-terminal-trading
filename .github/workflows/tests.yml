name: Offline reliability tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock.txt
      - run: pytest -q
      - run: python -m crypto_feed.tests_offline
      - run: node --check frontend/app.js && node --check frontend/research.js && node --check frontend/access.js && node --check frontend/validation.js && node --check frontend/workspace.js && node --check frontend/cockpit.js && node --check frontend/observed-replay.js
